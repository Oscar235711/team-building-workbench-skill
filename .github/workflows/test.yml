name: Test skill and generated workbench
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - run: node scripts/audit-package.mjs
      - run: node team-building-workbench/scripts/create-workbench.mjs --people 20 --budget 6000 --out work/ci
      - run: npm ci --no-audit --no-fund
        working-directory: work/ci
      - run: npm run build
        working-directory: work/ci
      - run: node scripts/smoke-worker.mjs work/ci
